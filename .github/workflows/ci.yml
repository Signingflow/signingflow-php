name: SDK PHP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        php: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: curl, ffi
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: |
          set -o pipefail
          XDEBUG_MODE=coverage php -d memory_limit=1G -d ffi.enable=true vendor/bin/phpunit --coverage-text | tee coverage.txt
          php -r '
          $text = file_get_contents("coverage.txt");
          preg_match("/Lines:\s+([0-9.]+)%/", $text, $lines);
          preg_match("/Branches:\s+([0-9.]+)%/", $text, $branches);
          if ($lines === [] || $branches === []) {
              fwrite(STDERR, $text);
              exit(1);
          }
          echo "lines {$lines[1]}% branches {$branches[1]}%\n";
          file_put_contents(".coverage-percent", $lines[1]);
          if ((float) $lines[1] < 80 || (float) $branches[1] < 80) {
              exit(1);
          }
          '
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.php == '8.3'
        with:
          name: coverage-percent
          path: .coverage-percent
          retention-days: 1

  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-percent
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-coverage-badge.sh "$(cat .coverage-percent)"
